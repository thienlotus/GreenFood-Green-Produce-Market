# Cấu hình Qodo PR-Agent (CodiumAI) tối ưu hóa Token cho GreenFood
# Mục tiêu: Đánh giá chất lượng code PR nhưng kiểm soát chặt chẽ ngân sách Token AI

[config]
# Sử dụng Google Gemini 1.5 Flash: Tốc độ cao, chi phí cực thấp / miễn phí, hỗ trợ context lớn
model = "gemini-1.5-flash"
fallback_models = ["gemini-1.5-flash"]

# Giới hạn trần Token (Token Budgeting)
max_model_tokens = 16000
max_output_tokens = 1500

# 1. BỎ QUA CÁC FILE RÁC / FILE TỰ SINH / TÀI LIỆU ĐỂ TIẾT KIỆM TOKEN
# Không bao giờ gửi các file tĩnh, lock files hoặc tài liệu vào AI
patch_extension_skip_types = [
  ".md", ".markdown",
  ".lock", ".json",
  ".svg", ".png", ".jpg", ".jpeg", ".webp", ".ico",
  ".map", ".min.js", ".min.css",
  ".csv", ".xlsx", ".pdf",
  ".txt", ".sql"
]

# 2. BỎ QUA CÁC PR KHÔNG CẦN THIẾT
# Không review các PR chỉ cập nhật tài liệu hoặc nâng cấp thư viện phụ
ignore_pr_title = ["chore", "docs", "style", "bump", "typo"]

[pr_reviewer]
# Giới hạn phạm vi review để tiết kiệm token
require_score_review = false
require_tests_review = false
require_estimate_effort_to_review = false
enable_auto_approval = false
num_code_suggestions = 3
inline_code_comments = true

# Hướng dẫn chi tiết AI tập trung vào các vấn đề cốt lõi của GreenFood:
# Bỏ qua lỗi format/style (đã có Pint/ESLint lo)
# Tập trung vào: Bảo mật (IDOR, SQL Injection), Race condition, N+1 query, CSRF
extra_instructions = """
Bạn là Senior Code Reviewer cho dự án GreenFood (Laravel 11 + Next.js 14).
QUY TẮC TIẾT KIỆM TOKEN:
- KHÔNG nhận xét về định dạng mã (indent, spacing, camelCase vs snake_case).
- CHỈ nêu tối đa 3 vấn đề nghiêm trọng nhất về:
  1. Bảo mật: Lỗ hổng IDOR, Mass Assignment, thiếu middleware phân quyền.
  2. Hiệu năng & DB: N+1 queries, thiếu index hoặc transaction trong thao tác nhiều bảng.
  3. Tính đúng đắn của logic nghiệp vụ (Auth, OTP, Đơn hàng, Tồn kho).
- Trả lời ngắn gọn, súc tích bằng Tiếng Việt kèm đoạn mã gợi ý sửa đổi.
"""

[pr_code_suggestions]
num_code_suggestions = 3
committable_code_suggestions = true
focus_only_on_problems = true
